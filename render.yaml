services:
  - type: web
    name: edugenie-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: USE_LOCAL_EXPLANATION_MODEL
        value: "false"
